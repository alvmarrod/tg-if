[project]
name = "tg-if"
version = "0.13.1"
description = "Broker aimed to be used between the Telegram API and a queue broker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "aio-pika>=9.4.0",
    "aiohttp>=3.14.1",
    "structlog>=25.1.0",
    "aiofiles>=25.1.0",
    "prometheus-client>=0.21.0",
    "tgcrypto>=1.2.5",
    "pyrotgfork>=2.2.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=src --cov-report=term-missing"
markers = [
    "integration: marks tests that require Docker (RabbitMQ container)",
]

[tool.mypy]
mypy_path = "src"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.unit.test_receiver_service"
disable_error_code = ["method-assign", "attr-defined"]

[[tool.mypy.overrides]]
module = "tests.unit.test_telegram_client"
disable_error_code = ["assignment", "func-returns-value"]

[[tool.mypy.overrides]]
module = "tests.unit.test_handlers"
disable_error_code = ["index", "union-attr"]

[[tool.mypy.overrides]]
module = "tests.unit.test_endpoint"
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = "tests.unit.test_publisher"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "tests.unit.test_media_downloader"
disable_error_code = ["attr-defined", "arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "tests.unit.test_admin_commands"
disable_error_code = ["arg-type", "union-attr"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest-timeout>=2.4.0",
    "types-aiofiles>=25.1.0.20260518",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0",
    "testcontainers>=4.0.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "hypothesis>=6.119.0",
]
