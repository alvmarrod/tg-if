repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-json
        exclude: tests/fixtures/
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: docker run --rm -v .:/work -w /work ghcr.io/astral-sh/ruff:latest check
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: docker run --rm -v .:/work -w /work ghcr.io/astral-sh/ruff:latest format
        language: system
        types: [python]
        pass_filenames: true

      - id: markdownlint
        name: markdownlint
        entry: docker run --rm -v .:/work -w /work ghcr.io/igorshubovych/markdownlint-cli:latest markdownlint --fix
        language: system
        types: [markdown]
        exclude: ^\.venv/

      - id: mypy
        name: mypy
        entry: bash -c 'uv run mypy src/ tests/'
        language: system
        types: [python]
        pass_filenames: false
